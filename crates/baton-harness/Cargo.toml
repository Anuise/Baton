[package]
name = "baton-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# 測試專用：以程序內方式啟動完整 Runtime，並提供全部 Port 的 fake（spec D-04）
[dependencies]
baton-api = { path = "../baton-api" }
baton-credential = { path = "../baton-credential" }
baton-domain = { path = "../baton-domain" }
baton-guardian = { path = "../baton-guardian" }
baton-ports = { path = "../baton-ports" }
baton-runtime = { path = "../baton-runtime" }
baton-store = { path = "../baton-store" }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }

[dev-dependencies]
base64 = "0.22"
baton-api = { path = "../baton-api" }
baton-client = { path = "../baton-client" }
baton-mcp-shim = { path = "../baton-mcp-shim" }
axum = "0.8"
