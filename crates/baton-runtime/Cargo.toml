[package]
name = "baton-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "baton-runtime"
path = "src/main.rs"

[dependencies]
baton-api = { path = "../baton-api" }
baton-credential = { path = "../baton-credential" }
baton-domain = { path = "../baton-domain" }
baton-ports = { path = "../baton-ports" }
baton-store = { path = "../baton-store" }
async-trait = "0.1"
futures = "0.3"
getrandom = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "process", "time", "fs", "io-util"] }
axum = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[dev-dependencies]
baton-client = { path = "../baton-client" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
